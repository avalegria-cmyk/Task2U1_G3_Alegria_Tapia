name: university
services:
  database:
    image: postgres:18.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-university}_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_manager}
      POSTGRES_USER: ${POSTGRES_USER:-academic_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - academic_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: university-php:local
    container_name: ${COMPOSE_PROJECT_NAME:-university}_php
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academic_manager}
      POSTGRES_USER: ${POSTGRES_USER:-academic_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: university-web:local
    container_name: ${COMPOSE_PROJECT_NAME:-university}_web
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      - api
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
volumes:
  academic_data:
    name: ${DATABASE_VOLUME:-university-academic-manager_academic_data}
